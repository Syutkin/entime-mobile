name: Create release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    name: Test, build and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            gradle.properties
            android/build.gradle
            android/app/build.gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # or: 'stable', 'beta', 'main' or 'master'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get tag name
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Check release type
        run: |
          if [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Get signing key
        run: echo $SIGNING_KEY | base64 -d > android/app/key.jks
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - run: java --version

      - uses: ./.github/actions/flutter-quality
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi -v
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 -v
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PATH: key.jks

      - name: Prepare APK artifact
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "build/release/entime-${RELEASE_VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/release/entime-${RELEASE_VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "build/release/entime-${RELEASE_VERSION}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/release/entime-${RELEASE_VERSION}-universal.apk"
          sha1sum build/release/entime-${RELEASE_VERSION}-*.apk > "build/release/entime-${RELEASE_VERSION}-apk.sha1"

      - name: Build Linux release
        run: flutter build linux --release -v

      - name: Package Linux release
        run: |
          tar -C build/linux/x64/release --transform 's,^bundle,entime,' -czf "build/release/entime-${RELEASE_VERSION}-linux-x64.tar.gz" bundle
          sha1sum "build/release/entime-${RELEASE_VERSION}-linux-x64.tar.gz" > "build/release/entime-${RELEASE_VERSION}-linux-x64.tar.gz.sha1"

      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/release/entime*"
          prerelease: ${{ env.IS_PRERELEASE }}
